<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>왁뿌볼 ASMR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: one tabletop scene, a real 3D ball resting on felt, controls tucked below like a toy shelf */
:root{
  --bg:#efe9f3; --table:#e3dbea; --tableHi:#f3eef7; --ink:#3a3044; --muted:#7d7088; --chip:#fff; --chipLine:#d8cde2; --accent:#c45d93;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif; --body:"Gowun Dodum",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f1a25; --table:#2a2332; --tableHi:#3a3046; --ink:#efe6f5; --muted:#a698b2; --chip:#2f2838; --chipLine:#453a50; --accent:#e58bbb; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1a25; --table:#2a2332; --tableHi:#3a3046; --ink:#efe6f5; --muted:#a698b2; --chip:#2f2838; --chipLine:#453a50; --accent:#e58bbb; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.9rem;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.count{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:260px;position:relative;margin-block:8px;border-radius:20px;background:radial-gradient(ellipse at 50% 35%,var(--tableHi),var(--table) 70%);overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;display:block;outline:none}
canvas:active{cursor:grabbing}
.hint,.done{position:absolute;left:0;right:0;top:14px;text-align:center;pointer-events:none}
.hint{color:var(--muted);font-size:.9rem;transition:opacity .4s}
.done{font-family:var(--display);font-size:1.4rem;color:var(--accent)}
.err{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.types{display:flex;gap:6px;flex-wrap:wrap}
.types button,.reset{font-family:var(--display);font-size:1rem;border:1.5px solid var(--chipLine);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;display:flex;align-items:center;gap:6px}
.types button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.types i{width:12px;height:12px;border-radius:50%;display:inline-block}
.reset{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,canvas:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.right{display:flex;align-items:center;gap:12px}
label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:6px}
input[type=range]{width:90px;accent-color:var(--accent)}
</style>

<header>
  <h1>왁뿌볼 <span>ASMR</span></h1>
  <div class="count" id="count">뿌신 조각 0 / 0</div>
</header>

<div class="stage" id="stage">
  <div class="hint" id="hint">꾹 누르고 버티면 주변 왁스가 와르르</div>
  <div class="done" id="done" hidden>완뿌! 새 볼로 또 뿌셔보세요</div>
</div>

<div class="controls">
  <div class="types" id="types"></div>
  <div class="right">
    <label for="vol">볼륨 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <button class="reset" id="reset">새 볼</button>
  </div>
</div>

<script>
const TYPES=[
  {id:"cotton",name:"솜사탕",wax:[330,80,80],inner:"#fbf3f7",innerSpot:"#f6c9de",pitch:1.1,thick:.9},
  {id:"mint",name:"민트초코",wax:[160,45,70],inner:"#5a3a2c",innerSpot:"#7a5240",pitch:.9,thick:1.1},
  {id:"lemon",name:"레몬",wax:[50,90,64],inner:"#fffbe6",innerSpot:"#ffe58a",pitch:1.2,thick:.8},
  {id:"berry",name:"블루베리 글리터",wax:[235,55,60],inner:"#e9e6ff",innerSpot:"#b9b0ff",pitch:1,thick:1,glitter:true},
  {id:"choco",name:"두꺼운 초코",wax:[22,45,30],inner:"#f3e7d6",innerSpot:"#d9b98f",pitch:.7,thick:1.5}
];
let type=TYPES[0];
const stage=document.getElementById('stage'),countEl=document.getElementById('count'),hint=document.getElementById('hint'),doneEl=document.getElementById('done');
function rnd(a,b){return a+Math.random()*(b-a)}

/* ---------- audio (synthesized) ---------- */
let ac=null,master,noise,volume=.8;
function initAudio(){if(ac){if(ac.state==='suspended')ac.resume();return}
  ac=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  master=ac.createGain();master.gain.value=volume;master.connect(comp).connect(ac.destination);
  noise=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
function grain(t,ft,f,q,dur,g){
  const s=ac.createBufferSource();s.buffer=noise;const fl=ac.createBiquadFilter();fl.type=ft;fl.frequency.value=f;fl.Q.value=q;
  const e=ac.createGain();e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.0015);e.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl).connect(e).connect(master);s.start(t,Math.random()*1.8);s.stop(t+dur+.03);}
function crunch(n){if(!ac)return;const t0=ac.currentTime+.005,P=type.pitch,T=type.thick;
  grain(t0,'bandpass',2600*P,1.2,.03,1.1);
  grain(t0,'lowpass',380*P,.8,.07*T,.7*T);
  const k=Math.min(46,6+n*4),spread=.05+Math.min(.28,n*.025)*T;
  for(let i=0;i<k;i++){const t=t0+Math.pow(Math.random(),1.6)*spread;
    grain(t,'bandpass',rnd(1500,7000)*P,rnd(.8,4),rnd(.004,.022),rnd(.25,.9));
    if(Math.random()<.25)grain(t,'bandpass',rnd(500,1200)*P,1.5,rnd(.015,.04)*T,rnd(.2,.5));}}
function crackle(){if(!ac)return;const t0=ac.currentTime;for(let i=0;i<5;i++)grain(t0+rnd(0,.05),'bandpass',rnd(2500,8000)*type.pitch,rnd(1,4),rnd(.003,.012),rnd(.15,.45));}
function tick(g=.4){if(!ac)return;grain(ac.currentTime,'bandpass',rnd(3000,7500),rnd(2,5),rnd(.003,.009),g);}

if(!window.THREE){stage.insertAdjacentHTML('beforeend','<div class="err">3D 라이브러리를 불러오지 못했어요. 새로고침해 주세요.</div>')}
else{

/* ---------- scene ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const cv=renderer.domElement;cv.tabIndex=0;cv.setAttribute('aria-label','왁뿌볼. 누른 채로 버티면 왁스가 부서져요. 스페이스바를 누르고 있어도 돼요.');
stage.prepend(cv);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,1,.1,50);
scene.add(new THREE.HemisphereLight(0xffffff,0xb8a6c4,.75));
const key=new THREE.DirectionalLight(0xffffff,.95);key.position.set(2.2,4,3);key.castShadow=true;
key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:.5,far:12});key.shadow.radius=4;scene.add(key);
const rim=new THREE.DirectionalLight(0xffe6f2,.35);rim.position.set(-3,1.5,-2);scene.add(rim);
const FLOOR=-1.0;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.ShadowMaterial({opacity:.22}));
floor.rotation.x=-Math.PI/2;floor.position.y=FLOOR;floor.receiveShadow=true;scene.add(floor);
const ball=new THREE.Group();scene.add(ball);

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  const z=w/h<.8?7.4:5.4;camera.position.set(0,1.1,z);camera.lookAt(0,-.15,0);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

/* ---------- textures ---------- */
function spotTex(){const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
  g.fillStyle=type.inner;g.fillRect(0,0,512,256);
  for(let i=0;i<26;i++){const x=rnd(0,512),y=rnd(30,226),r=rnd(18,60),gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,type.innerSpot);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r)}
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
function glitterTex(){const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,1024,512);for(let i=0;i<2600;i++){g.fillStyle=`rgba(255,255,255,${rnd(.4,1)})`;g.fillRect(rnd(0,1024),rnd(0,512),rnd(1,2.5),rnd(1,2.5))}
  return new THREE.CanvasTexture(c)}

/* ---------- ball construction ---------- */
const INNER_R=.962,SEEDS=150;
let inner=null,innerOrig=null,chips=[],falling=[],glitter=null;
let dent=0,dentV=0,dirty=true,down=false,pressure=0,crackAcc=0;
function freeMesh(m){m.geometry.dispose();m.material.dispose()}
function build(){
  for(const ch of chips){ball.remove(ch.mesh);scene.remove(ch.mesh);freeMesh(ch.mesh)}
  for(const f of falling){scene.remove(f.mesh);freeMesh(f.mesh)}
  if(inner){ball.remove(inner);inner.material.map.dispose();freeMesh(inner)}
  chips=[];falling=[];dent=0;dentV=0;pressure=0;down=false;
  if(glitter){glitter.dispose();glitter=null}if(type.glitter)glitter=glitterTex();

  const ig=new THREE.SphereGeometry(INNER_R,128,96);
  inner=new THREE.Mesh(ig,new THREE.MeshStandardMaterial({map:spotTex(),roughness:.85,metalness:0}));
  inner.castShadow=true;ball.add(inner);innerOrig=ig.attributes.position.array.slice();

  // seeds spread evenly (fibonacci) then jittered so the chip outlines look hand-broken
  const seeds=[];const ga=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<SEEDS;i++){const y=1-2*(i+.5)/SEEDS,r=Math.sqrt(1-y*y),th=ga*i;
    seeds.push(new THREE.Vector3(Math.cos(th)*r+rnd(-.08,.08),y+rnd(-.08,.08),Math.sin(th)*r+rnd(-.08,.08)).normalize())}
  const sg=new THREE.SphereGeometry(1,112,80).toNonIndexed();
  const P=sg.attributes.position.array,N=sg.attributes.normal.array,U=sg.attributes.uv.array,triN=P.length/9;
  const buckets=seeds.map(()=>({p:[],n:[],u:[]}));const v=new THREE.Vector3();
  for(let t=0;t<triN;t++){const o=t*9;v.set((P[o]+P[o+3]+P[o+6])/3,(P[o+1]+P[o+4]+P[o+7])/3,(P[o+2]+P[o+5]+P[o+8])/3);
    if(v.lengthSq()<1e-6)continue;v.normalize();
    const w=.035*Math.sin(v.x*23+v.y*17)*Math.cos(v.z*19-v.x*11);
    let best=0,bd=-9;for(let s=0;s<SEEDS;s++){const d=seeds[s].dot(v)+(s%3-1)*w;if(d>bd){bd=d;best=s}}
    const b=buckets[best];for(let k=0;k<9;k++){b.p.push(P[o+k]);b.n.push(N[o+k])}for(let k=0;k<6;k++)b.u.push(U[t*6+k])}
  sg.dispose();
  const [h,s,l]=type.wax;
  buckets.forEach(b=>{if(!b.p.length)return;
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(b.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(b.n,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(b.u,2));
    const lv=l+rnd(-3.5,3.5),col=new THREE.Color().setHSL(h/360,s/100,lv/100);
    const m=new THREE.MeshPhysicalMaterial({color:col,roughness:.42,clearcoat:.55,clearcoatRoughness:.35,side:THREE.DoubleSide});
    if(glitter){m.emissiveMap=glitter;m.emissive=new THREE.Color(0xffffff);m.emissiveIntensity=.55;m.roughness=.3}
    const mesh=new THREE.Mesh(g,m);mesh.castShadow=true;ball.add(mesh);
    const c=new THREE.Vector3();for(let k=0;k<b.p.length;k+=3)c.add(v.set(b.p[k],b.p[k+1],b.p[k+2]));c.divideScalar(b.p.length/3);
    chips.push({mesh,s:0,dir:c.clone().normalize(),cen:c,base:Float32Array.from(b.p),orig:Float32Array.from(b.p),nrm:Float32Array.from(b.n),hsl:[h,s,lv]});
  });
  ball.rotation.set(0,0,0);dirty=true;updateCount();
}
function updateCount(){const f=chips.filter(c=>c.s==2).length;countEl.textContent=`뿌신 조각 ${f} / ${chips.length}`;
  doneEl.hidden=!(f==chips.length&&chips.length)}

/* ---------- dent: radial pushdown around the press point, with a slight bulge everywhere else ---------- */
const pdir=new THREE.Vector3(0,0,1);const SIG=.42;
function deformArray(src,dst,nrm,count){
  const px=pdir.x,py=pdir.y,pz=pdir.z,d=dent;
  for(let i=0;i<count;i+=3){const x=src[i],y=src[i+1],z=src[i+2],r=Math.hypot(x,y,z)||1,vx=x/r,vy=y/r,vz=z/r;
    let cs=vx*px+vy*py+vz*pz;cs=cs>1?1:cs<-1?-1:cs;const a=Math.acos(cs),sm=Math.exp(-(a*a)/(SIG*SIG));
    const g=1-d*1.12*sm+.12*d;dst[i]=x*g;dst[i+1]=y*g;dst[i+2]=z*g;
    const sa=Math.sin(a);let nx=vx,ny=vy,nz=vz;
    if(sa>1e-4&&Math.abs(d)>1e-4){const k=(2.24*d*sm*a/(SIG*SIG))/g;const tx=(vx*cs-px)/sa,ty=(vy*cs-py)/sa,tz=(vz*cs-pz)/sa;
      nx=vx-k*tx;ny=vy-k*ty;nz=vz-k*tz;const nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl}
    nrm[i]=nx;nrm[i+1]=ny;nrm[i+2]=nz}}
function applyDeform(){
  const ip=inner.geometry.attributes.position,inn=inner.geometry.attributes.normal;
  deformArray(innerOrig,ip.array,inn.array,innerOrig.length);ip.needsUpdate=true;inn.needsUpdate=true;
  for(const ch of chips){if(ch.s==2)continue;const pa=ch.mesh.geometry.attributes.position,na=ch.mesh.geometry.attributes.normal;
    deformArray(ch.base,pa.array,na.array,ch.base.length);pa.needsUpdate=true;na.needsUpdate=true}}

/* ---------- breaking ---------- */
function crackAt(dir,rad){let nc=0;
  for(const ch of chips){if(ch.s!=0)continue;const d=ch.dir.distanceTo(dir);
    if(d<rad*(.8+Math.random()*.4)){ch.s=1;nc++;
      // shrink the chip toward its middle and lift it a hair, so gaps open onto the clay underneath
      const b=ch.base,o=ch.orig,c=ch.cen;for(let i=0;i<b.length;i+=3){b[i]=(c.x+(o[i]-c.x)*.93)*1.006;b[i+1]=(c.y+(o[i+1]-c.y)*.93)*1.006;b[i+2]=(c.z+(o[i+2]-c.z)*.93)*1.006}
      ch.mesh.material.color.setHSL(ch.hsl[0]/360,ch.hsl[1]/100,(ch.hsl[2]-5)/100)}}
  if(nc)dirty=true;return nc}
function collapse(dir){let nf=0;
  for(const ch of chips){if(ch.s!=1)continue;const d=ch.dir.distanceTo(dir);
    if(d<.55*(.85+Math.random()*.3)){ch.s=2;nf++;drop(ch,d)}}
  if(nf){crunch(Math.max(4,nf*.6));crackle();setTimeout(crackle,60);updateCount()}
  crackAt(dir,.65);}
function drop(ch,d){
  const g=ch.mesh.geometry,pa=g.attributes.position;pa.array.set(ch.base);pa.needsUpdate=true;
  g.attributes.normal.array.set(ch.nrm);g.attributes.normal.needsUpdate=true;
  g.translate(-ch.cen.x,-ch.cen.y,-ch.cen.z);
  // turn the chip so its outer face points up; it can then land convex side up
  const q=new THREE.Quaternion().setFromUnitVectors(ch.dir,new THREE.Vector3(0,1,0));g.applyQuaternion(q);
  ch.mesh.quaternion.copy(q).invert();ch.mesh.position.copy(ch.cen);
  scene.attach(ch.mesh);
  const vel=ch.mesh.position.clone().sub(ball.position).normalize().multiplyScalar(rnd(.6,1.6)*(1-d*.5)).add(new THREE.Vector3(rnd(-.3,.3),rnd(.4,1.3),rnd(-.3,.3)));
  ch.mesh.material.transparent=true;
  falling.push({mesh:ch.mesh,vel,spin:new THREE.Vector3(rnd(-6,6),rnd(-6,6),rnd(-6,6)),bounced:0,rest:0,life:1});
  if(falling.length>220){const f=falling.shift();scene.remove(f.mesh);freeMesh(f.mesh)}}

/* ---------- input: hold to build pressure ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),inv=new THREE.Matrix4(),tmpQ=new THREE.Quaternion(),unit=new THREE.Sphere(new THREE.Vector3(),1);
function pickDir(e){const b=cv.getBoundingClientRect();ndc.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);
  ray.setFromCamera(ndc,camera);ball.updateMatrixWorld();inv.copy(ball.matrixWorld).invert();
  const r=ray.ray.clone().applyMatrix4(inv),hit=new THREE.Vector3();
  return r.intersectSphere(unit,hit)?hit.normalize():null}
function startPress(dir){down=true;pdir.copy(dir);pressure=0;crackAcc=0;dentV+=.9;const nc=crackAt(pdir,.2);if(nc)crunch(nc);hint.style.opacity=0;}
cv.addEventListener('pointerdown',e=>{initAudio();const d=pickDir(e);if(!d)return;cv.setPointerCapture(e.pointerId);startPress(d)});
cv.addEventListener('pointermove',e=>{if(!down)return;const d=pickDir(e);if(d)pdir.lerp(d,.5).normalize()});
const up=()=>{down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();initAudio();
  const w=new THREE.Vector3(rnd(-.6,.6),rnd(-.3,.6),1).normalize();ball.updateMatrixWorld();
  startPress(w.applyQuaternion(ball.getWorldQuaternion(tmpQ).invert()))}});
cv.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter')down=false});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;
  if(down){pressure=Math.min(1,pressure+dt/.7);crackAcc+=dt;
    if(crackAcc>.09){crackAcc=0;const nc=crackAt(pdir,.2+.22*pressure);if(nc)crunch(nc)}
    if(pressure>=1){collapse(pdir);pressure=0;dentV+=1.4}}
  else ball.rotation.y+=dt*.18;
  // spring toward the held depth; on release it overshoots and bounces back out
  const target=down?.07+.1*pressure:0;dentV+=(target-dent)*260*dt;dentV*=Math.exp(-11*dt);dent+=dentV*dt;
  if(Math.abs(dent)>.0004||Math.abs(dentV)>.002||dirty){applyDeform();dirty=Math.abs(dent)>.0004}
  ball.scale.set(1+dent*.12,1-dent*.1,1+dent*.12);ball.position.y=-dent*.1;
  for(let i=falling.length-1;i>=0;i--){const f=falling[i],m=f.mesh;
    if(!f.rest){f.vel.y-=9.8*dt;m.position.addScaledVector(f.vel,dt);
      m.rotation.x+=f.spin.x*dt;m.rotation.y+=f.spin.y*dt;m.rotation.z+=f.spin.z*dt;
      if(m.position.y<FLOOR+.03&&f.vel.y<0){m.position.y=FLOOR+.03;
        if(f.bounced<2&&f.vel.y<-.8){if(!f.bounced)tick(Math.min(.5,-f.vel.y*.12));f.vel.y*=-.28;f.vel.x*=.55;f.vel.z*=.55;f.spin.multiplyScalar(.4);f.bounced++}
        else{f.rest=1;m.rotation.set(rnd(-.15,.15),rnd(0,6.28),rnd(-.15,.15))}}}
    else{f.life-=dt/6;if(f.life<.25)m.material.opacity=f.life/.25;
      if(f.life<=0){scene.remove(m);freeMesh(m);falling.splice(i,1)}}}
  renderer.render(scene,camera);requestAnimationFrame(frame)}

/* ---------- ui ---------- */
const typesEl=document.getElementById('types');
TYPES.forEach(t=>{const b=document.createElement('button');b.id='type-'+t.id;b.innerHTML=`<i style="background:hsl(${t.wax[0]} ${t.wax[1]}% ${t.wax[2]}%)"></i>${t.name}`;
  b.setAttribute('aria-pressed',t===type);b.onclick=()=>{type=t;[...typesEl.children].forEach(x=>x.setAttribute('aria-pressed',x===b));build()};typesEl.appendChild(b)});
document.getElementById('reset').onclick=()=>{build();hint.style.opacity=1};
document.getElementById('vol').oninput=e=>{volume=+e.target.value;if(master)master.gain.value=volume};
build();requestAnimationFrame(frame);
}
</script>
